/* pay for a capex item: cash, equipment loan, or lease */
function payCapex(st, cost, mode, kind, years, ref) {

    const g = gradeInfo(st); if (!g.equip) return { err: 'noCredit' };
    const down = r2(cost * 0.2); if (B(st, 'cash') < down) return { err: 'cash' };
    const a = addAsset(st, kind, cost, years, ref);

  o_factor: ['Factoraje: vender cuentas por cobrar (−3.5%)', 'Factoring: sell receivables (−3.5%)'], o_bridge: ['Préstamo puente caro', 'Expensive bridge loan'], o_inject: ['Meter dinero propio', 'Put in personal money'], o_delay: ['Pedir a proveedores 3 semanas más', 'Ask suppliers for 3 more weeks'],
  // recommendations (advisors on decisions)
  rStartBasic: ['Renta la bodega chica (200 kW) y pon una estación de cada tipo, menos leak test. Así puedes integrar racks A en consigna desde la semana 1. Total ≈ $75k.', 'Lease the small warehouse (200 kW) and set up one station of each type except leak test. That lets you integrate Rack A on consignment from week 1. Total about $75k.'],
  rQuoteCfoNo: ['No cotices. Necesitas {wc} en material y solo alcanzamos {cash} sumando efectivo, línea de crédito y anticipo. Primero crece con consigna o consigue financiamiento.', 'Do not quote. You need {wc} in material and we only reach {cash} counting cash, credit line and deposit. Grow on consignment first or line up financing.'],
  rQuoteCfoDep: ['Cotiza arriba del costo y pide anticipo. El material se paga antes de cobrar: el anticipo protege el efectivo.', 'Quote above cost and ask for a deposit. Material is paid before we collect, and the deposit protects cash.'],
  rQuoteCfoMargin: ['Cuida el margen: en consigna vendemos horas de técnico, no material. No regales el precio.', 'Protect the margin. On consignment we sell technician hours, not material. Do not give the price away.'],
  rQuoteOpsLate: ['Con la carga actual entrego en {lead} semanas y el cliente pide {req}. Prometer menos es garantizar un atraso.', 'With the current load I can deliver in {lead} weeks and the customer wants {req}. Promising less guarantees a late order.'],
  rQuoteOpsOk: ['Tenemos capacidad: entrego en {lead} semanas (piden {req}). Precio competitivo para ganarlo.', 'We have capacity: I can deliver in {lead} weeks (they want {req}). Price it to win.'],
  rQuoteQaStrict: ['Este cliente es muy estricto con DOA. Nuestro FPY va en {fpy}%: si lo ganamos, auditoría al 100% en empaque.', 'This customer is very strict on DOA. Our FPY is {fpy}%. If we win it, run a 100% audit at packing.'],
  rQuoteQaOk: ['Calidad sin objeción. FPY actual {fpy}%.', 'No quality objection. Current FPY is {fpy}%.'],
  rQuoteHr: ['Para cumplir necesitaríamos unos {n} técnicos dedicados. Contratar toma 1 a 3 semanas.', 'To deliver we would need about {n} dedicated technicians. Hiring takes 1 to 3 weeks.'],
  rQuoteMentorNo: ['Yo no lo cotizaría. Pide {wc} en material y tu alcance es {cash}. Un pedido así te puede quebrar aunque sea rentable.', 'I would not quote it. It needs {wc} in material and your reach is {cash}. An order like this can break you even if it is profitable.'],
  rQuoteMentorTurn: ['Precio justo arriba de tu costo, anticipo si el cliente lo acepta, y promete {lead} semanas (piden {req}).', 'Price just above your cost, a deposit if the customer accepts it, and promise {lead} weeks (they want {req}).'],
  rQuoteMentorCons: ['Precio un poco abajo del mercado para ganar historial y promete {lead} semanas (piden {req}). No prometas menos de lo que tu línea puede.', 'Price a little under market to build a track record and promise {lead} weeks (they want {req}). Do not promise faster than your line can do.'],
  rQuoteNoLeak: ['El rack L es líquido y no tenemos equipo de leak test. Cómpralo o réntalo en Producción antes de prometer; con él entregamos en {lead} semanas.', 'Rack L is liquid cooled and we have no leak test rig. Buy or lease one in Production before promising. With it we deliver in {lead} weeks.'],
  rBuyCfoCost: ['La opción más barata. Ahorra {save} contra local.', 'The cheapest option. It saves {save} versus local.'],
  rBuyCfoCash: ['Cuidado con el efectivo: cualquier opción se paga antes de cobrar. Elige la que menos efectivo adelanta y usa la línea de crédito.', 'Watch cash. Every option is paid before we collect. Pick the one that needs the least cash up front and use the credit line.'],
  rBuyOpsOnTime: ['Llega a tiempo para producir y entregar (necesito el material en la semana {wk}).', 'Arrives in time to build and deliver (I need the material by week {wk}).'],
  rBuyOpsLate: ['Ninguna opción barata llega a tiempo: escojo la más rápida (necesito material en la semana {wk}).', 'No cheap option arrives on time, so I pick the fastest (I need material by week {wk}).'],
  rBuyQa: ['El distribuidor local hace prueba de entrada: menos fallas de componente que comprar directo a Asia.', 'The local distributor runs incoming tests: fewer component failures than buying direct from Asia.'],
  rBuyMentor: ['Necesitas el material en la semana {wk}. Compara costo, fecha de llegada y cuánto efectivo sale antes de cobrar.', 'You need the material by week {wk}. Compare cost, arrival date and how much cash leaves before you collect.'],
  rLateOps: ['Tiempo extra 4 semanas y recuperamos la fecha.', 'Four weeks of overtime and we recover the date.'],
  rLateCfo: ['El tiempo extra cuesta 1.5x. Renegociar la fecha cuesta menos que la penalización.', 'Overtime costs 1.5x. Renegotiating the date costs less than the penalty.'],
  rLateHrTired: ['La moral está en {m}. Más tiempo extra quema a la gente: mejor otro turno.', 'Morale is at {m}. More overtime burns people out. Add a shift instead.'],
  rLateHrOk: ['La gente aguanta unas semanas de tiempo extra (moral {m}).', 'The team can handle a few weeks of overtime (morale {m}).'],
  rLateMentor: ['Si el cliente es importante, tiempo extra. Si no, avisa hoy y renegocia: avisar tarde es peor que el atraso.', 'If the customer matters, use overtime. If not, call today and renegotiate. Warning late is worse than being late.'],
  rRaiseHr: ['El mercado paga {mkt}/h para su nivel. Si no le subimos, se va con la competencia.', 'The market pays {mkt}/h for that level. If we do not raise it, they go to a competitor.'],
  rRaiseCfo: ['El aumento completo cuesta {cost} al año. La mitad es razonable.', 'The full raise costs {cost} a year. Half is reasonable.'],
  rIdeaEng: ['Hagamos un piloto: si funciona baja la estación {pct}%.', 'Let us run a pilot. If it works the station drops {pct}%.'],
  rIdeaCfo: ['Recupera la inversión en unas {wk} semanas.', 'It pays back in about {wk} weeks.'],
  rIdeaQa: ['Piloto primero: un cambio sin validar puede subir defectos.', 'Pilot first. An unvalidated change can raise defects.'],
  rInvCfoNeed: ['Necesitamos el efectivo: acepta aunque cedas {pct}% de la empresa.', 'We need the cash. Accept even though you give up {pct}% of the company.'],
  rInvCfoCounter: ['No urge: contraoferta. Ceder {pct}% hoy es caro si el EBITDA sigue creciendo.', 'It is not urgent, so counter. Giving up {pct}% today is expensive if EBITDA keeps growing.'],
  rInvHr: ['Un socio con experiencia ayuda a atraer directores.', 'An experienced partner helps attract directors.'],
  rQualQa: ['DOA en {doa}% de entregas. Para la línea y contén ya; cada DOA cuesta más que una semana parada.', 'DOA on {doa}% of deliveries. Stop the line and contain now. Each DOA costs more than a week of downtime.'],
  rQualOps: ['Parar nos atrasa todo. Auditoría al 100% en empaque sin detener la línea.', 'Stopping makes everything late. Run a 100% audit at packing without stopping the line.'],
  rQualCfo: ['Contención en empaque: protege al cliente sin perder la semana de ingresos.', 'Containment at packing protects the customer without losing a week of revenue.'],
  rTermsCfo: ['A {days} días financiamos al cliente con nuestro efectivo. Contraoferta a 60.', 'At {days} days we finance the customer with our cash. Counter at 60.'],
  rTermsSales: ['Acepta: es un buen cliente y quiere repetir.', 'Accept. It is a good customer and wants to reorder.'],
  rGenCfo: ['Vende hoy ese inventario ({v}). Cuando salga la nueva generación vale 20% menos.', 'Sell that inventory ({v}) today. When the new generation ships it is worth 20% less.'],
  rGenOps: ['Si lo vendemos y luego cae un pedido, nos quedamos sin material.', 'If we sell it and an order comes in, we are left with no material.'],
  rSupCfo: ['Mejores términos liberan efectivo: acepta ({days} días).', 'Better terms free up cash. Accept ({days} days).'],
  rSupOps: ['Sin cambio para el piso. Acepta.', 'No change for the floor. Accept.'],
  rCrisisFactor: ['Faltan {gap}. Tenemos {ar} por cobrar: vende las facturas al factor y cubrimos el hueco hoy.', 'We are short {gap}. We have {ar} in receivables. Sell the invoices to a factor and cover the gap today.'],
  rCrisisBridge: ['Faltan {gap} y casi no hay cuentas por cobrar. Préstamo puente: caro, pero salva la nómina.', 'We are short {gap} and receivables are thin. Take a bridge loan. It is expensive but it saves payroll.'],
  rCrisisLast: ['Ya no hay crédito. Mete tu dinero o pide plazo a proveedores.', 'There is no more credit. Put in your own money or ask suppliers for more time.'],
  rCrisisDelay: ['Pedir plazo a proveedores nos da aire, pero subirán precios después.', 'Asking suppliers for more time buys air, but they will raise prices later.'],
  rCrisisHr: ['Lo que sea, pero que la nómina salga a tiempo.', 'Whatever we do, payroll must go out on time.'],

  mHireFirst: ['Tú solo integras todo, pero tu tiempo es limitado. Un técnico te libera para vender.', 'You can integrate everything alone, but your time is limited. A technician frees you to sell.'],
  mHireDir: ['Ya tienes historial. Un director te da consejos con tus números y mejora su área, pero cuesta $125k a $200k al año.', 'You now have a track record. A director advises with your numbers and improves the area, but costs $125k to $200k a year.'],

  // lessons
  ls_title: ['Lección', 'Lesson'],
  ls_firstEq: ['Capex y depreciación', 'Capex and depreciation'], lb_firstEq: ['Comprar equipo saca efectivo hoy, pero en el estado de resultados aparece poco a poco como depreciación (7 años). Por eso una compra grande no hunde la utilidad del mes, pero sí el efectivo. Rentar (leasing) cambia eso: no hay capex, pero pagas cada mes.', 'Buying equipment takes cash today, but the income statement shows it slowly as depreciation (7 years). A big purchase does not sink the month profit, but it does sink cash. Leasing changes that: no capex, but you pay every month.'],
  ls_firstLoan: ['Interés vs capital', 'Interest versus principal'], lb_firstLoan: ['Del pago mensual, solo el interés es gasto en resultados. El capital reduce la deuda en el balance y sale del efectivo en la sección de financiamiento. Puedes tener utilidad y aun así no alcanzar a pagar el préstamo.', 'Of each monthly payment, only interest is an expense. Principal lowers the debt on the balance sheet and leaves cash in the financing section. You can be profitable and still not afford the loan payment.'],
  ls_turnkey: ['Turnkey: margen bajo, efectivo enorme', 'Turnkey: thin margin, huge cash'], lb_turnkey: ['Un rack turnkey vende millones con 3% a 8% de margen. El material se paga antes de cobrar, así que el pedido consume efectivo durante semanas. El anticipo del cliente y los términos con proveedores deciden si sobrevives.', 'A turnkey rack sells for millions at a 3% to 8% margin. Material is paid before you collect, so the order consumes cash for weeks. The customer deposit and supplier terms decide whether you survive.'],
  ls_late: ['Prometer lo que puedes cumplir', 'Promise what you can deliver'], lb_late: ['El atraso cuesta penalización, reputación y pedidos futuros. Cotiza con la capacidad real de tu cuello de botella, no con la que te gustaría tener.', 'Lateness costs penalties, reputation and future orders. Quote with the real capacity of your bottleneck, not the capacity you wish you had.'],
  ls_doa: ['El costo de la calidad', 'The cost of quality'], lb_doa: ['Un defecto atrapado en burn-in cuesta horas. El mismo defecto en el cliente cuesta miles de dólares, reputación y relación. Prevenir (poka-yoke, gente que sigue procesos) es lo más barato.', 'A defect caught at burn-in costs hours. The same defect at the customer costs thousands of dollars, reputation and the relationship. Prevention (poka-yoke, people who follow the process) is the cheapest.'],
  ls_turnover: ['La rotación cuesta', 'Turnover costs money'], lb_turnover: ['Cuando alguien se va pierdes su curva de aprendizaje, pagas reclutamiento y el siguiente empieza con más defectos. Sueldo de mercado, entrenamiento y líderes bajan la rotación.', 'When someone leaves you lose their learning curve, pay for recruiting, and the next hire starts with more defects. Market pay, training and leaders lower turnover.'],
  ls_taxes: ['Impuestos y depreciación', 'Taxes and depreciation'], lb_taxes: ['Al cierre del año pagas 21% federal sobre la utilidad, impuesto a la propiedad sobre tu equipo y, si vendes más de $2.47M, el franchise tax de Texas. La depreciación baja la utilidad gravable sin sacar efectivo.', 'At year end you pay 21% federal tax on profit, property tax on your equipment and, above $2.47M in revenue, the Texas franchise tax. Depreciation lowers taxable profit without taking cash.'],
  ls_knowCost: ['Conoce tu costo', 'Know your cost'], lb_knowCost: ['Perdiste varias por precio. Antes de bajar precio pregúntate si tu costo es el problema: horas por rack, defectos, retrabajo. Bajar costo te deja ganar sin regalar margen.', 'You lost several on price. Before cutting price, ask whether your cost is the problem: hours per rack, defects, rework. Lower cost lets you win without giving away margin.'],
  ls_obsolete: ['Obsolescencia', 'Obsolescence'], lb_obsolete: ['En AI cada generación de GPU deja vieja a la anterior. El inventario que compraste por MOQ alto pierde valor de golpe. Comprar justo a tiempo cuesta más por unidad, pero protege contra esto.', 'In AI each GPU generation makes the previous one old. Inventory you bought for a high MOQ loses value overnight. Buying just in time costs more per unit, but protects you from this.'],
  ls_credit: ['Riesgo de crédito', 'Credit risk'], lb_credit: ['Vender no es cobrar. Los startups y neoclouds pueden quebrar con tus facturas. Pide anticipos, revisa crédito (Finanzas lo hace) y no concentres todo en un cliente.', 'Selling is not collecting. Startups and neoclouds can go bankrupt holding your invoices. Ask for deposits, check credit (Finance does it) and do not concentrate in one customer.'],
  ls_cashCrunch: ['Sin efectivo no hay empresa', 'No cash, no company'], lb_cashCrunch: ['Las empresas no quiebran por pérdidas, quiebran por falta de efectivo. Con 6 semanas en sobregiro la empresa cierra. Línea de crédito, factoraje y anticipos son tus salvavidas.', 'Companies do not die from losses, they die from lack of cash. Six weeks of overdraft closes the company. The credit line, factoring and deposits are your lifelines.'],
  ls_profitNotCash: ['Utilidad no es efectivo', 'Profit is not cash'], lb_profitNotCash: ['Puedes tener utilidad y quedarte sin dinero: lo que vendiste está en cuentas por cobrar, lo que compraste está en inventario. Mira el flujo de efectivo, no solo el estado de resultados.', 'You can be profitable and run out of money: what you sold sits in receivables and what you bought sits in inventory. Watch the cash flow, not only the income statement.'],
  ls_overtime: ['Tiempo extra: parche, no solución', 'Overtime: a patch, not a fix'], lb_overtime: ['El tiempo extra cuesta 1.5x, rinde menos por hora y baja la moral. Si dura más de un mes, el problema es capacidad: turno, gente o automatización.', 'Overtime costs 1.5x, yields less per hour and lowers morale. If it lasts more than a month, the problem is capacity: a shift, people or automation.'],
  ls_automation: ['Automatizar con criterio', 'Automate with judgment'], lb_automation: ['La automatización baja horas y defectos, pero sin un ingeniero que la instale y la mantenga rinde la mitad. Automatiza el cuello de botella, no lo que se ve bonito.', 'Automation lowers hours and defects, but without an engineer to install and maintain it, it delivers half. Automate the bottleneck, not what looks impressive.'],

  ls_bigCustomer: ['Clientes grandes', 'Large customers'], lb_bigCustomer: ['Un cliente grande da volumen estable y diluye tus costos fijos, pero manda: precio bajo, pago a 60–75 días, scorecard mensual y penalizaciones. Depender de uno solo es riesgoso.', 'A large customer brings steady volume and dilutes fixed costs, but they are in charge: low price, payment at 60–75 days, a monthly scorecard and penalties. Depending on only one is risky.'],
  ls_costDown: ['Cost down', 'Cost down'], lb_costDown: ['Los clientes grandes piden bajar precio cada año. Si tu costo no baja (mejora continua, Black Belts, automatización), el margen desaparece.', 'Large customers ask for lower prices every year. If your cost does not drop (continuous improvement, Black Belts, automation), the margin disappears.'],
  ls_union: ['Sindicato: pros y contras', 'Unions: pros and cons'], lb_union: ['A favor: menos rotación, reglas claras y gente más estable. En contra: más costo, menos flexibilidad para turnos y despidos, y riesgo de huelga. La mejor defensa es que la gente no lo necesite.', 'Pros: lower turnover, clear rules and steadier people. Cons: more cost, less flexibility for shifts and layoffs, and strike risk. The best defense is that people do not need one.'],
  ls_bullwhip: ['Efecto látigo', 'Bullwhip effect'], lb_bullwhip: ['El forecast del cliente cambió mucho. Si compras con MOQ alto según el forecast, te quedas con inventario; si no, te faltan partes. Compra corto y con proveedores flexibles cuando el forecast es volátil.', 'The customer forecast changed a lot. If you buy high MOQs against the forecast, you are left with inventory; if not, you run short. Buy short and with flexible suppliers when the forecast is volatile.'],
  ls_source1: ['Source one', 'Source one'], lb_source1: ['Seis meses seguidos cumpliendo OTD y DOA te ganan más volumen y mejor precio. Ser source one es la recompensa a la disciplina, no a la cotización más barata.', 'Six months in a row meeting OTD and DOA earn you more volume and a better price. Being source one rewards discipline, not the cheapest quote.'],
  ls_blackbelt: ['El problema correcto', 'The right problem'], lb_blackbelt: ['Un Black Belt resuelve bien lo que le asignes. El ahorro depende de que el problema importe: el cuello de botella, el defecto que llega al cliente o el efectivo atorado. Cada director empuja el problema de su área; tú decides con datos.', 'A Black Belt solves well whatever you assign. The savings depend on the problem mattering: the bottleneck, the defect that reaches the customer, or the stuck cash. Each director pushes their own area; you decide with data.'],

  ls_supplierCredit: ['Crédito con proveedores', 'Supplier credit'], lb_supplierCredit: ['Nadie te envía millones en material sin garantía. Tu crédito con proveedores crece con tu historial, tu calificación bancaria y tu efectivo. Antes de ganar un pedido turnkey, asegúrate de poder comprar el material.', 'Nobody ships you millions in material without security. Your supplier credit grows with your track record, bank rating and cash. Before winning a turnkey order, make sure you can buy the material.'],

  plWalk: ['Recorrido guiado del estado de resultados', 'Guided walk through the income statement'], plWalkHint: ['El asesor te explica cada renglón, de la venta a la utilidad neta. También puedes tocar cualquier renglón con ⓘ.', 'The advisor explains every line, from sales to net income. You can also tap any line with ⓘ.'],
  plShare: ['% de tu venta', '% of your sales'], plWhy: ['Por qué se movió', 'Why it moved'], plStep: ['Paso {i} de {n}', 'Step {i} of {n}'], plOfSales: ['de tu venta', 'of your sales'],
  plStory: ['La historia del mes', 'The story of the month'], plPrev: ['Anterior', 'Back'], plNext: ['Siguiente', 'Next'], plToStory: ['Ver la historia', 'See the story']
};

</script>
<script>
/* RackForge advisor coach: turns the numbers into a story, a lesson and three options.
   Pure functions over the game state. The UI passes a small context with text helpers. */
(function (root) {
'use strict';
const E = root.RF;
const sum = (a, f) => a.reduce((s, x) => s + (f ? f(x) : x), 0);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

/* ---------- the nine numbers that run a rack plant ---------- */
function facts(st) {
  const k = st.kpi || {};
  const c = E.cal(st.w), mi = c.mi, m0 = Math.max(0, mi - 2);
  const M = E.movesRange(st, m0, mi);
  const byType = ty => sum(E.INCOME.filter(a => E.ACC[a] === ty), a => M[a] || 0);
  const rev = -((M.sales || 0) + (M.deduct || 0));
  const cogs = byType('C'), sga = byType('S');
  const ebitda = rev - cogs - sga + (M.depx || 0);
  const H = st.hist.filter(h => E.cal(h.w).mi >= m0);
  const nW = Math.max(1, H.length), mFrac = nW / 4.33;
  const delivered = sum(H, h => h.delivered);
  const gp = rev - cogs;
  const perRack = delivered ? gp / delivered : null;
  const gm = rev > 0 ? gp / rev : null;
  // mix of turnkey work changes what a healthy margin looks like
  const w0 = H.length ? H[0].w : st.w;
  const recent = st.orders.filter(o => o.delivered > 0 && (o.status === 'open' || (o.doneW || 0) >= w0));
  const revAll = sum(recent, o => o.delivered * o.price), revTurn = sum(recent.filter(o => o.mode === 'turn'), o => o.delivered * o.price);
  const turnShare = revAll > 0 ? revTurn / revAll : 0;
  const gmTarget = 0.30 * (1 - turnShare) + 0.07 * turnShare;
  const days = nW * 7, mat = M.mat || 0;
  const ar = E.B(st, 'ar'), inv = E.B(st, 'inv'), ap = -E.B(st, 'ap');
  const cap365 = x => clamp(x, 0, 365);
  const dso = rev > 0 ? cap365(ar / (rev / days)) : null;
  const dio = mat > 0 ? cap365(inv / (mat / days)) : null;
  const dpo = mat > 0 ? cap365(Math.max(0, ap) / (mat / days)) : null;
  const ccc = dso == null ? null : dso + (dio || 0) - (dpo || 0);
  const hl = st.hist.length;
  const cash = E.B(st, 'cash'), cash4 = hl >= 5 ? st.hist[hl - 5].cash : null;
  const locFree = st.loc && st.loc.open ? Math.max(0, st.loc.limit - st.loc.bal) : 0;
  const slope = cash4 == null ? null : (cash - cash4) / 4;
  const LA = E.loadAhead(st, true);
  let blW = 0, blStation = null;
  for (const s of E.STAGES) {
    if (!(LA[s] > 0)) continue;
    const cp = E.stationCap(st, s, true).std;
    const w = cp > 0 ? LA[s] / cp : 99;
    if (w > blW) { blW = w; blStation = s; }
  }
  const last4 = st.hist.slice(-4), prev8 = st.hist.slice(-12, -4);
  const rate = (A, n, d) => { const D = sum(A, d); return D ? sum(A, n) / D : null; };
  const otd4 = rate(last4, h => h.ontime, h => h.delivered), otdP = rate(prev8, h => h.ontime, h => h.delivered);
  const fpy4 = rate(last4, h => h.fpyPass, h => h.biDone), fpyP = rate(prev8, h => h.fpyPass, h => h.biDone);
  const snaps = st.months.slice(-3);
  return {
    mi, cash, cash4, slope, burn: k.fixedWeek || 0, locFree,
    runway: (k.fixedWeek || 0) > 0 ? (cash + locFree) / k.fixedWeek : 99,
    ar, inv, ap, dso, dio, dpo, ccc,
    rev, cogs, sga, gp, gm, gmTarget, turnShare, perRack, delivered, mFrac,
    ebitdaM: ebitda / mFrac, revM: rev / mFrac, sgaM: sga / mFrac, racksM: delivered / mFrac,
    ebitdaHist: snaps.map(s => s.ebitda),
    otd: k.otd == null ? null : k.otd, otd4, otdP, backlogV: k.backlogV || 0, backlogU: k.backlogUnits || 0, blW, blStation,
    fpy: k.fpy == null ? null : k.fpy, fpy4, fpyP, doa: k.doaRate || 0,
    bn: k.bottleneck || null, bnU: k.bnUtil || 0, LA,
    morale: k.morale == null ? 75 : k.morale, techs: st.emps.filter(e => e.role === 'tech').length
  };
}

/* ---------- helpers ---------- */
const sevRank = { bad: 0, warn: 1, ok: 2, info: 3 };
function styleOf(st) { return (st.mentor && st.mentor.prof) || 'exp'; }
const STYLE_PREF = { exp: 'safe', inn: 'growth', proc: 'safe', mej: 'cost', lid: 'people' };
function pickRec(st, opts, sev) {
  // when something is wrong the fix comes first; otherwise the advisor leans to his style
  if (sev === 'bad' || sev === 'warn') { const i = opts.findIndex(o => o.fix); return i >= 0 ? i : 0; }
  const i = opts.findIndex(o => o.style === STYLE_PREF[styleOf(st)]);
  return i >= 0 ? i : 0;
}
function finish(st, topic) {
  topic.options = topic.options.filter(Boolean).slice(0, 3);
  const r = pickRec(st, topic.options, topic.sev);
  topic.options.forEach((o, i) => o.rec = i === r);
  const m = (st.coach && st.coach.m && st.coach.m[topic.id]) || 0;
  topic.learned = m >= 3 && topic.sev === 'ok';
  return topic;
}
function speaker(st, role) { return st.emps.some(e => e.role === role) ? role : 'mentor'; }

/* ---------- topic: money ---------- */
function topicCash(st, F, X) {
  const { L, money } = X;
  const rw = Math.max(0, Math.round(F.runway));
  const sev = F.cash < 0 || F.runway < 4 ? 'bad' : F.runway < 8 ? 'warn' : 'ok';
  const cccTxt = F.ccc == null
    ? L('Todavía no hay ventas suficientes para medir el ciclo de efectivo.', 'There are not enough sales yet to measure the cash cycle.')
    : L(`Tu dinero tarda ${Math.round(F.ccc)} días en regresar: el cliente tarda ${Math.round(F.dso)} días en pagarte, el material se queda ${Math.round(F.dio || 0)} días en tu planta y el proveedor te da ${Math.round(F.dpo || 0)} días de crédito.`,
        `Your money takes ${Math.round(F.ccc)} days to come back: customers take ${Math.round(F.dso)} days to pay, material sits ${Math.round(F.dio || 0)} days in your plant and suppliers give you ${Math.round(F.dpo || 0)} days of credit.`);
  const now = L(`Tienes ${money(F.cash)} en el banco${F.locFree ? ` y ${money(F.locFree)} disponibles en tu línea de crédito` : ''}. Tus gastos fijos son de unos ${money(F.burn)} por semana, así que te alcanza para ${rw > 52 ? 'más de un año' : rw + ' semanas'}. `,
    `You have ${money(F.cash)} in the bank${F.locFree ? ` and ${money(F.locFree)} available on your credit line` : ''}. Your fixed costs are about ${money(F.burn)} per week, so you can last ${rw > 52 ? 'more than a year' : rw + ' weeks'}. `) + cccTxt;
  let trend;
  if (F.slope == null) trend = L('Necesito unas semanas más de historia para decirte la tendencia.', 'I need a few more weeks of history to tell you the trend.');
  else if (F.slope < -100) {
    const zero = F.cash > 0 ? Math.round(F.cash / -F.slope) : 0;
    trend = L(`En las últimas 4 semanas el efectivo bajó ${money(-F.slope * 4)}. Si sigue igual, ${zero > 0 ? `te quedas sin efectivo en unas ${zero} semanas` : 'ya estás en números rojos'}. Ojo: en racks es normal que baje mientras compras material para un pedido grande; lo importante es que regrese cuando el cliente pague.`,
      `In the last 4 weeks cash went down ${money(-F.slope * 4)}. If it keeps going like this, ${zero > 0 ? `you run out of cash in about ${zero} weeks` : 'you are already in the red'}. Note: in racks it is normal for cash to drop while you buy material for a big order; what matters is that it comes back when the customer pays.`);
  } else trend = L(`En las últimas 4 semanas el efectivo subió ${money(F.slope * 4)}. Vas bien: el negocio está generando dinero, no solo utilidad en papel.`,
    `In the last 4 weeks cash went up ${money(F.slope * 4)}. Good: the business is generating money, not just profit on paper.`);
  const concept = L('El efectivo es el oxígeno de la empresa: puedes tener utilidad y aun así quebrar si se te acaba el dinero antes de que el cliente pague. Las semanas de efectivo te dicen cuánto aguantas si no entra nada. El ciclo de conversión de efectivo (CCC) son los días que tu dinero está atrapado entre pagar al proveedor y cobrarle al cliente: CCC = días que tarda en pagarte el cliente + días de inventario − días de crédito del proveedor. En racks los insumos son carísimos, así que cada día del ciclo cuesta mucho dinero.',
    'Cash is the oxygen of the company: you can show a profit and still go bankrupt if money runs out before the customer pays. Weeks of cash tell you how long you last if nothing comes in. The cash conversion cycle (CCC) is the number of days your money is trapped between paying the supplier and collecting from the customer: CCC = days the customer takes to pay + days of inventory − days of supplier credit. Rack parts are very expensive, so every day of the cycle costs a lot of money.');
  const openAR = sum(st.invoices.filter(i => i.open && i.kind === 'sale'), i => i.amt);
  const reserve = st.ownerReserve || 0;
  const O = [];
  if (sev !== 'ok') {
    if (openAR > 0) O.push({ fix: true, style: 'safe', title: L(`Factorizar tus cuentas por cobrar (${money(openAR)})`, `Factor your receivables (${money(openAR)})`),
      why: L(`El banco te adelanta hoy lo que te deben los clientes. Pro: efectivo inmediato sin deuda nueva. Contra: pagas 3.5% (${money(openAR * 0.035)}), que sale directo de tu utilidad.`, `The bank pays you today what customers owe you. Pro: immediate cash with no new debt. Con: you pay 3.5% (${money(openAR * 0.035)}), straight out of your profit.`),
      act: { kind: 'act', name: 'factor', args: {} } });
    if (F.locFree > 0) { const amt = Math.round(Math.min(F.locFree, Math.max(20000, F.burn * 4)) / 1000) * 1000;
      O.push({ fix: true, style: 'growth', title: L(`Disponer ${money(amt)} de tu línea de crédito`, `Draw ${money(amt)} from your credit line`),
        why: L('Pro: es rápido y lo regresas cuando cobres. Contra: pagas interés cada mes y si la usas para tapar pérdidas solo pospones el problema.', 'Pro: it is fast and you repay it when you collect. Con: you pay interest every month, and if you use it to cover losses you only delay the problem.'),
        act: { kind: 'act', name: 'locDraw', args: { amt } } }); }
    if (reserve > 0) { const amt = Math.round(Math.min(reserve, Math.max(20000, F.burn * 4)) / 1000) * 1000;
      O.push({ fix: true, style: 'safe', title: L(`Meter ${money(amt)} de tu ahorro personal`, `Put in ${money(amt)} of your personal savings`),
        why: L('Pro: sin intereses ni bancos. Contra: es tu dinero; si el negocio no cambia, lo pierdes también.', 'Pro: no interest and no bank. Con: it is your own money; if the business does not change, you lose it too.'),
        act: { kind: 'act', name: 'inject', args: { amt } } }); }
    O.push({ style: 'cost', title: L('Pedir anticipo y no aceptar pedidos llave en mano grandes por ahora', 'Ask for deposits and avoid large turnkey orders for now'),
      why: L('Pro: cuidas el efectivo porque en consigna el cliente pone el material. Contra: creces más lento y ganas menos por rack.', 'Pro: you protect cash because in consignment the customer supplies the material. Con: you grow slower and earn less per rack.'),
      act: { kind: 'tab', tab: 'sales' } });
    O.push({ style: 'people', title: L('Recortar gastos fijos (tiempo extra, contrataciones en espera)', 'Cut fixed costs (overtime, hiring on hold)'),
      why: L('Pro: baja lo que gastas cada semana. Contra: si recortas gente que necesitas, entregas tarde y pierdes clientes.', 'Pro: lowers what you spend every week. Con: if you cut people you need, you deliver late and lose customers.'),
      act: { kind: 'tab', tab: 'people' } });
    O.push({ style: 'safe', title: L('Ir al banco: préstamo SBA o línea de crédito', 'Go to the bank: SBA loan or credit line'),
      why: L('Pro: dinero a varios años para crecer o aguantar. Contra: si tu calificación es baja te prestan poco y caro, y la deuda se paga aunque el negocio vaya mal.', 'Pro: money over several years to grow or hold on. Con: with a low grade they lend little and at a high rate, and debt must be paid even when business is bad.'),
      act: { kind: 'tab', tab: 'fin' } });
  } else {
    if (st.loc && st.loc.bal > 0) O.push({ style: 'safe', title: L(`Pagar tu línea de crédito (${money(st.loc.bal)})`, `Pay down your credit line (${money(st.loc.bal)})`),
      why: L('Pro: dejas de pagar interés y tu calificación con el banco mejora. Contra: te queda menos colchón en el banco.', 'Pro: you stop paying interest and your bank grade improves. Con: you keep less cushion in the bank.'),
      act: { kind: 'act', name: 'locRepay', args: { amt: Math.round(Math.min(st.loc.bal, Math.max(0, F.cash - F.burn * 8))) } } });
    O.push({ style: 'safe', title: L('Mantener el colchón y no hacer nada', 'Keep the cushion and do nothing'),
      why: L('Pro: aguantas un mes malo o un cliente que paga tarde. Contra: el dinero quieto no te hace crecer.', 'Pro: you survive a bad month or a late-paying customer. Con: idle money does not grow the business.'),
      act: null });
    O.push({ style: 'growth', title: L('Invertir en capacidad: equipo o automatización', 'Invest in capacity: equipment or automation'),
      why: L('Pro: produces más racks con la misma gente. Contra: baja tu efectivo hoy y solo se paga si tienes pedidos para llenar esa capacidad.', 'Pro: you build more racks with the same people. Con: it lowers your cash today and only pays off if you have orders to fill that capacity.'),
      act: { kind: 'tab', tab: 'improve' } });
    O.push({ style: 'cost', title: L('Negociar más días de crédito con proveedores', 'Negotiate more credit days with suppliers'),
      why: L('Pro: acorta tu ciclo de efectivo sin costo. Contra: el proveedor puede subir precio o pedirte volumen.', 'Pro: it shortens your cash cycle at no cost. Con: the supplier may raise prices or ask for volume.'),
      act: { kind: 'tab', tab: 'buy' } });
  }
  return finish(st, { id: 'cash', who: speaker(st, 'cfo'), title: L('Dinero', 'Money'), sev, concept, now, trend, options: O,
    metrics: [{ k: 'cash', v: money(F.cash), sev: F.cash < 0 ? 'bad' : 'ok' }, { k: 'runway', v: rw > 52 ? '52+' : String(rw), sev }, { k: 'ccc', v: F.ccc == null ? '—' : Math.round(F.ccc) + L(' días', ' days'), sev: F.ccc == null ? 'info' : F.ccc > 75 ? 'bad' : F.ccc > 45 ? 'warn' : 'ok' }],
    say: L(`Dinero: te alcanza para ${rw > 52 ? 'más de un año' : rw + ' semanas'}.`, `Money: you can last ${rw > 52 ? 'more than a year' : rw + ' weeks'}.`) });
}

/* ---------- topic: profit ---------- */
function topicProfit(st, F, X) {
  const { L, money, pct } = X;
  const concept = L('El margen por rack es lo que te pagan por un rack menos lo que te cuesta hacerlo: material, mano de obra directa, energía de burn-in, flete y garantías. El EBITDA es lo que gana la operación antes de intereses, impuestos y depreciación: te dice si el negocio en sí deja dinero. Con ese margen tienes que pagar los gastos fijos (sueldos de oficina, renta, seguros). Si el margen de todos tus racks no alcanza para los gastos fijos, pierdes dinero aunque la planta esté llena.',
    'Margin per rack is what you are paid for a rack minus what it costs you to build it: material, direct labor, burn-in power, freight and warranty. EBITDA is what the operation earns before interest, taxes and depreciation: it tells you if the business itself makes money. That margin has to pay your fixed costs (office salaries, rent, insurance). If the margin from all your racks does not cover fixed costs, you lose money even with a full plant.');
  const tgt = F.gmTarget;
  const tgtTxt = F.turnShare > 0.5 ? L('llave en mano', 'turnkey') : L('consigna', 'consignment');
  let sev = 'info', now, trend;
  if (!F.delivered || F.rev <= 0) {
    sev = st.stats.delivered ? 'warn' : 'info';
    now = L('Todavía no hay racks entregados en los últimos meses, así que no hay margen que medir. Mientras tanto, cada semana pagas sueldos y renta sin ingresos.', 'There are no racks delivered in recent months, so there is no margin to measure yet. Meanwhile, every week you pay wages and rent with no income.');
    trend = L('Tu prioridad es entregar el primer pedido a tiempo: es lo que abre la puerta a más clientes.', 'Your priority is to deliver the first order on time: that is what opens the door to more customers.');
  } else {
    sev = F.gm < tgt * 0.5 || F.ebitdaM < 0 ? 'bad' : F.gm < tgt ? 'warn' : 'ok';
    const need = F.perRack > 0 ? Math.ceil(F.sgaM / F.perRack) : null;
    now = L(`Ganas ${money(F.perRack)} por rack (${pct(F.gm)} de margen). Una integradora sana en ${tgtTxt} anda arriba de ${pct(tgt)}. Al mes entregas ${Math.round(F.racksM) === 1 ? 'un rack' : 'unos ' + Math.round(F.racksM) + ' racks'} y tu EBITDA mensual es ${money(F.ebitdaM)}. `,
      `You earn ${money(F.perRack)} per rack (${pct(F.gm)} margin). A healthy ${tgtTxt} integrator is above ${pct(tgt)}. You deliver ${Math.round(F.racksM) === 1 ? 'one rack' : 'about ' + Math.round(F.racksM) + ' racks'} per month and your monthly EBITDA is ${money(F.ebitdaM)}. `)
      + (need != null ? L(`Para cubrir tus gastos fijos (${money(F.sgaM)} al mes) necesitas unos ${need} racks al mes con este margen.`, `To cover your fixed costs (${money(F.sgaM)} per month) you need about ${need} racks per month at this margin.`) : '');
    const eh = F.ebitdaHist;
    if (eh.length >= 2) { const up = eh[eh.length - 1] >= eh[eh.length - 2];
      trend = L(`El EBITDA de los últimos meses fue ${eh.map(x => money(x)).join(' → ')}: va ${up ? 'subiendo' : 'bajando'}. ${up ? 'Si mantienes el margen y el volumen, el valor de tu empresa crece cada mes.' : 'Revisa si fue por menos racks, peor precio o más costo; abajo te doy opciones.'}`,
        `EBITDA over the last months was ${eh.map(x => money(x)).join(' → ')}: it is going ${up ? 'up' : 'down'}. ${up ? 'If you keep the margin and the volume, your company value grows every month.' : 'Check whether it came from fewer racks, worse price or higher cost; I give you options below.'}`); }
    else trend = L('Con un mes más de historia te digo si el margen va mejorando.', 'With one more month of history I can tell you if the margin is improving.');
  }
  const O = [];
  const growthFirst = !F.delivered || F.racksM * (F.perRack || 0) < F.sgaM;
  O.push({ fix: sev !== 'ok' && growthFirst, style: 'growth', title: L('Conseguir más volumen para diluir los gastos fijos', 'Win more volume to spread your fixed costs'),
    why: L('Pro: cada rack extra casi todo es utilidad porque la renta y los sueldos de oficina ya están pagados. Contra: necesitas capacidad y efectivo para crecer.', 'Pro: almost every extra rack is profit because rent and office salaries are already paid. Con: you need capacity and cash to grow.'),
    act: { kind: 'tab', tab: 'sales' } });
  O.push({ fix: sev !== 'ok' && !growthFirst, style: 'safe', title: L('Subir precio 3 a 5% en las próximas cotizaciones', 'Raise prices 3 to 5% on the next quotes'),
    why: L('Pro: va directo al margen sin cambiar nada en la planta. Contra: ganas menos cotizaciones, sobre todo con clientes nuevos.', 'Pro: it goes straight to margin with no change on the floor. Con: you win fewer quotes, especially with new customers.'),
    act: { kind: 'tab', tab: 'sales' } });
  O.push({ style: 'cost', title: F.turnShare > 0.3 ? L('Comprar material en Asia o consolidar compras', 'Buy material in Asia or consolidate orders') : L('Bajar horas por rack con automatización o un Black Belt', 'Cut hours per rack with automation or a Black Belt'),
    why: F.turnShare > 0.3 ? L('Pro: el material es 90% del costo en llave en mano; 5% menos es mucho dinero. Contra: más tiempo de entrega, mínimos de compra y más efectivo atrapado.', 'Pro: material is 90% of turnkey cost; 5% less is a lot of money. Con: longer lead times, minimum order quantities and more cash tied up.')
      : L('Pro: en consigna tu costo es mano de obra; menos horas es margen directo. Contra: cuesta dinero hoy y tarda semanas en dar resultado.', 'Pro: in consignment your cost is labor; fewer hours is direct margin. Con: it costs money today and takes weeks to pay back.'),
    act: { kind: 'tab', tab: F.turnShare > 0.3 ? 'buy' : 'improve' } });
  return finish(st, { id: 'profit', who: speaker(st, 'cfo'), title: L('Ganancia', 'Profit'), sev, concept, now, trend, options: O,
    metrics: [{ k: 'margin', v: F.perRack == null ? '—' : money(F.perRack) + ' · ' + pct(F.gm), sev }, { k: 'ebitda', v: money(F.ebitdaM) + L('/mes', '/mo'), sev: F.ebitdaM < 0 ? 'bad' : 'ok' }],
    say: F.perRack == null ? L('Ganancia: aún sin racks entregados.', 'Profit: no racks delivered yet.') : L(`Ganancia: ${money(F.perRack)} por rack, ${pct(F.gm)} de margen.`, `Profit: ${money(F.perRack)} per rack, ${pct(F.gm)} margin.`) });
}

/* ---------- topic: customers ---------- */
function topicCust(st, F, X) {
  const { L, money, pct, sName } = X;
  const concept = L('Entregas a tiempo (OTD) es el porcentaje de racks que entregas en la fecha que prometiste. Es tu reputación: abajo de 95% los clientes grandes no te dan programas y algunos te cobran penalización. La cartera de pedidos es el trabajo que ya vendiste y falta hacer. Medida en semanas de planta te dice si te falta vender (menos de 3 semanas) o si prometiste de más (más de 10).',
    'On-time delivery (OTD) is the percentage of racks delivered on the date you promised. It is your reputation: below 95% big customers do not give you programs and some charge penalties. The backlog is work you already sold and still have to build. Measured in plant weeks, it tells you if you need more sales (under 3 weeks) or if you promised too much (over 10).');
  const blW = F.blW >= 99 ? null : F.blW;
  const otdSev = F.otd == null ? 'info' : F.otd >= 0.95 ? 'ok' : F.otd >= 0.85 ? 'warn' : 'bad';
  const blSev = F.backlogU === 0 ? (st.stats.delivered ? 'warn' : 'info') : blW == null || blW > 12 ? 'warn' : blW < 2 ? 'warn' : 'ok';
  const sev = sevRank[otdSev] <= sevRank[blSev] ? otdSev : blSev;
  const otdTxt = F.otd == null ? L('Todavía no entregas racks, así que no hay OTD.', 'You have not delivered racks yet, so there is no OTD.')
    : L(`Entregaste a tiempo el ${pct(F.otd)} de los racks de las últimas 12 semanas (la meta es 95%).`, `You delivered ${pct(F.otd)} of racks on time over the last 12 weeks (the target is 95%).`);
  const blTxt = F.backlogU === 0 ? L(' No tienes pedidos abiertos: la planta se va a quedar sin trabajo.', ' You have no open orders: the plant will run out of work.')
    : blW == null ? L(` Tienes ${F.backlogU} racks vendidos (${money(F.backlogV)}), pero hoy no tienes gente o equipo en ${sName(F.blStation)} para hacerlos.`, ` You have ${F.backlogU} racks sold (${money(F.backlogV)}), but today you have no people or equipment at ${sName(F.blStation)} to build them.`)
    : L(` Tienes ${F.backlogU} racks vendidos (${money(F.backlogV)}), unas ${blW.toFixed(1)} semanas de trabajo.`, ` You have ${F.backlogU} racks sold (${money(F.backlogV)}), about ${blW.toFixed(1)} weeks of work.`);
  const now = otdTxt + blTxt;
  let trend;
  if (F.otd4 != null && F.otdP != null) trend = F.otd4 >= F.otdP
    ? L(`Las últimas 4 semanas entregaste ${pct(F.otd4)} a tiempo contra ${pct(F.otdP)} antes: vas mejorando.`, `Over the last 4 weeks you delivered ${pct(F.otd4)} on time versus ${pct(F.otdP)} before: you are improving.`)
    : L(`Las últimas 4 semanas bajaste a ${pct(F.otd4)} a tiempo (antes ${pct(F.otdP)}). Si sigue así, vas a empezar a pagar penalizaciones y perder clientes.`, `Over the last 4 weeks you dropped to ${pct(F.otd4)} on time (before ${pct(F.otdP)}). If this continues, you will start paying penalties and losing customers.`);
  else trend = blW != null && blW > 10 ? L('Prometiste más de lo que la planta puede hacer: los próximos pedidos van a salir tarde si no agregas capacidad.', 'You promised more than the plant can build: the next orders will be late unless you add capacity.')
    : L('En cuanto tengas más entregas te digo si vas mejorando.', 'Once you have more deliveries I can tell you if you are improving.');
  const O = [];
  if (otdSev === 'bad' || otdSev === 'warn' || (blW != null && blW > 10) || blW == null && F.backlogU > 0) {
    if (!st.pol.ot) O.push({ fix: true, style: 'safe', title: L('Tiempo extra por 4 semanas', 'Overtime for 4 weeks'),
      why: L('Pro: más horas mañana mismo, sin contratar. Contra: cuesta 50% más por hora y después de 6 semanas baja la moral y suben los defectos.', 'Pro: more hours starting tomorrow, no hiring. Con: each hour costs 50% more, and after 6 weeks morale drops and defects go up.'),
      act: { kind: 'act', name: 'policy', args: { k: 'ot', v: true } } });
    O.push({ fix: !!st.pol.ot, style: 'growth', title: L('Contratar para el cuello de botella', 'Hire for the bottleneck'),
      why: L('Pro: capacidad permanente. Contra: costo fijo cada semana y tarda 1 a 3 semanas en llegar. Abajo te digo a quién.', 'Pro: permanent capacity. Con: a fixed cost every week and it takes 1 to 3 weeks to arrive. Below I tell you who.'),
      act: { kind: 'tab', tab: 'people' } });
    O.push({ style: 'people', title: L('Prometer plazos más largos en las próximas cotizaciones', 'Promise longer lead times on the next quotes'),
      why: L('Pro: dejas de comprometer lo que no puedes cumplir. Contra: algunos clientes se van con quien promete menos semanas.', 'Pro: you stop committing to what you cannot deliver. Con: some customers go to whoever promises fewer weeks.'),
      act: { kind: 'tab', tab: 'sales' } });
    if (st.pol.shifts < 3) O.push({ style: 'growth', title: L('Agregar un turno', 'Add a shift'),
      why: L('Pro: el mismo equipo trabaja más horas. Contra: necesitas gente para ese turno y el turno de noche cuesta más.', 'Pro: the same equipment works more hours. Con: you need people for that shift and nights cost more.'),
      act: { kind: 'act', name: 'policy', args: { k: 'shifts', v: st.pol.shifts + 1 } } });
    O.push({ style: 'safe', title: L('Mover gente al cuello de botella', 'Move people to the bottleneck'),
      why: L('Pro: no cuesta nada. Contra: la estación de donde sale puede atrasarse.', 'Pro: it costs nothing. Con: the station they leave may fall behind.'),
      act: { kind: 'tab', tab: 'prod' } });
  } else if (F.backlogU === 0 || (blW != null && blW < 2)) {
    O.push({ fix: true, style: 'growth', title: L('Cotizar más agresivo para llenar la planta', 'Quote more aggressively to fill the plant'),
      why: L('Pro: una planta parada igual paga renta y sueldos; un rack con poco margen es mejor que ninguno. Contra: si bajas mucho el precio, el cliente se acostumbra.', 'Pro: an idle plant still pays rent and wages; a rack with a thin margin is better than none. Con: if you cut the price too much, the customer gets used to it.'),
      act: { kind: 'tab', tab: 'sales' } });
    O.push({ style: 'safe', title: L('Mantener precio y esperar pedidos', 'Hold the price and wait for orders'),
      why: L('Pro: cuidas el margen. Contra: cada semana sin trabajo te cuesta tus gastos fijos completos.', 'Pro: you protect the margin. Con: every week without work costs you your full fixed costs.'),
      act: null });
    O.push({ style: 'people', title: L('Usar el tiempo libre para entrenar al equipo', 'Use the slack time to train the team'),
      why: L('Pro: suben nivel y calidad para cuando llegue el trabajo. Contra: cuesta dinero y no genera ingresos hoy.', 'Pro: skills and quality go up for when the work arrives. Con: it costs money and brings no income today.'),
      act: { kind: 'act', name: 'policy', args: { k: 'train', v: 2 } } });
  } else {
    O.push({ style: 'safe', title: L('Mantener el ritmo y prometer con colchón', 'Keep the pace and promise with a buffer'),
      why: L('Pro: sigues cumpliendo y tu reputación sube. Contra: alguna cotización se pierde por pedir una semana más.', 'Pro: you keep delivering and your reputation grows. Con: you lose a few quotes by asking for one more week.'),
      act: null });
    O.push({ style: 'growth', title: L('Buscar un programa con un cliente grande', 'Go after a program with a large customer'),
      why: L('Pro: volumen estable por meses y te acerca a ser source one. Contra: te exigen calidad y entregas muy altas; si fallas, pierdes el programa.', 'Pro: steady volume for months and a step toward source one. Con: they demand very high quality and delivery; if you fail, you lose the program.'),
      act: { kind: 'tab', tab: 'sales' } });
    O.push({ style: 'cost', title: L('Subir un poco el precio a clientes donde cumples siempre', 'Raise prices a little with customers you always deliver to'),
      why: L('Pro: tu buena entrega vale dinero. Contra: si el mercado está flojo, te cambian por otro.', 'Pro: your good delivery is worth money. Con: if the market is slow, they switch to someone else.'),
      act: { kind: 'tab', tab: 'sales' } });
  }
  return finish(st, { id: 'cust', who: speaker(st, 'coo'), title: L('Clientes', 'Customers'), sev, concept, now, trend, options: O,
    metrics: [{ k: 'otd', v: pct(F.otd), sev: otdSev }, { k: 'backlog', v: money(F.backlogV) + (blW == null ? '' : ' · ' + blW.toFixed(1) + L(' sem', ' wk')), sev: blSev }],
    say: F.otd == null ? L(`Clientes: ${F.backlogU} racks en cartera.`, `Customers: ${F.backlogU} racks in backlog.`) : L(`Clientes: ${pct(F.otd)} a tiempo.`, `Customers: ${pct(F.otd)} on time.`) });
}

/* ---------- topic: plant ---------- */
function topicPlant(st, F, X) {
  const { L, money, pct, sName } = X;
  const concept = L('Calidad a la primera (FPY) es el porcentaje de racks que pasan burn-in sin retrabajo. Cada rack que falla usa dos veces las horas de burn-in y de técnico, y retrasa a los demás. El cuello de botella es la estación más cargada: la planta completa solo produce lo que sale de ahí. Una hora perdida en el cuello es una hora perdida para toda la planta; una hora ganada en otra estación no sirve de nada.',
    'First pass yield (FPY) is the percentage of racks that pass burn-in with no rework. Every failed rack uses burn-in and technician hours twice and delays the others. The bottleneck is the most loaded station: the whole plant only produces what comes out of it. An hour lost at the bottleneck is an hour lost for the whole plant; an hour gained at another station is worth nothing.');
  const fpySev = F.fpy == null ? 'info' : F.fpy >= 0.92 ? 'ok' : F.fpy >= 0.8 ? 'warn' : 'bad';
  const missingEq = !!(F.bn && E.eqCount(st, F.bn) === 0);
  const bnU = missingEq ? 9 : Math.min(1.5, F.bnU);
  const bnSev = !F.bn ? 'info' : missingEq || bnU >= 1.2 ? 'bad' : bnU > 0.98 ? 'warn' : 'ok';
  const sev = sevRank[fpySev] <= sevRank[bnSev] ? fpySev : bnSev;
  const sc = F.bn ? E.stationCap(st, F.bn, true) : null;
  const eqLimited = !!(sc && (sc.eqH <= 0 || (sc.n > 0 && sc.eqH < sc.lab)));
  const fpyTxt = F.fpy == null ? L('Todavía no hay racks en burn-in para medir calidad.', 'No racks through burn-in yet to measure quality.')
    : L(`${pct(F.fpy)} de tus racks pasan burn-in a la primera (sano: 92% o más).`, `${pct(F.fpy)} of your racks pass burn-in the first time (healthy: 92% or more).`);
  const bnTxt = !F.bn ? L(' No hay un cuello de botella claro esta semana.', ' There is no clear bottleneck this week.')
    : missingEq ? L(` Tu cuello de botella es ${sName(F.bn)}: no tienes ese equipo y hay trabajo esperando.`, ` Your bottleneck is ${sName(F.bn)}: you do not have that equipment and work is waiting.`)
    : L(` Tu cuello de botella es ${sName(F.bn)}, trabajando al ${pct(bnU)}${bnU >= 1.5 ? L(' o más', '') : ''}${eqLimited ? L(' y lo que falta ahí es equipo, no gente', ' and what is missing there is equipment, not people') : ''}.`, ` Your bottleneck is ${sName(F.bn)}, running at ${bnU >= 1.5 ? 'over ' : ''}${pct(bnU)}${eqLimited ? ' and what is missing there is equipment, not people' : ''}.`);
  const now = fpyTxt + bnTxt;
  let trend;
  if (F.fpy4 != null && F.fpyP != null) trend = F.fpy4 >= F.fpyP
    ? L(`La calidad va mejorando: ${pct(F.fpyP)} antes, ${pct(F.fpy4)} las últimas 4 semanas.`, `Quality is improving: ${pct(F.fpyP)} before, ${pct(F.fpy4)} over the last 4 weeks.`)
    : L(`La calidad va empeorando: ${pct(F.fpyP)} antes, ${pct(F.fpy4)} las últimas 4 semanas. Si no la atiendes, pronto vas a ver clientes con racks que llegan muertos (DOA).`, `Quality is getting worse: ${pct(F.fpyP)} before, ${pct(F.fpy4)} over the last 4 weeks. If you do not act, customers will soon receive dead racks (DOA).`);
  else trend = L('Con más racks en burn-in te digo la tendencia de calidad.', 'With more racks through burn-in I can tell you the quality trend.');
  const O = [];
  if (fpySev === 'bad' || fpySev === 'warn') {
    O.push({ fix: true, style: 'safe', title: L('Subir el entrenamiento a intensivo', 'Raise training to intensive'),
      why: L('Pro: menos errores de armado en pocas semanas. Contra: cuesta dinero y horas de producción mientras entrenan.', 'Pro: fewer build errors within a few weeks. Con: it costs money and production hours while they train.'),
      act: { kind: 'act', name: 'policy', args: { k: 'train', v: 2 } } });
    O.push({ style: 'cost', title: L('Proyecto de Black Belt para subir FPY', 'Black Belt project to raise FPY'),
      why: L('Pro: ataca la causa raíz y el ahorro se queda. Contra: necesitas un Black Belt contratado y tarda semanas.', 'Pro: it attacks the root cause and the savings stay. Con: you need a Black Belt on staff and it takes weeks.'),
      act: { kind: 'tab', tab: 'improve' } });
    O.push({ style: 'people', title: L('Contratar gente que siga procesos', 'Hire people who follow process'),
      why: L('Pro: el perfil "sigue procesos" comete menos errores. Contra: es un poco más lento y no propone mejoras.', 'Pro: the follows-process profile makes fewer errors. Con: a bit slower and does not suggest improvements.'),
      act: { kind: 'tab', tab: 'people' } });
  } else if (F.bn && (bnSev === 'bad' || bnSev === 'warn')) {
    if (eqLimited || missingEq) {
      const base = E.EQ[F.bn].cost;
      O.push({ fix: true, style: 'safe', title: L(`Comprar equipo usado para ${sName(F.bn)} (${money(base * 0.5)})`, `Buy used equipment for ${sName(F.bn)} (${money(base * 0.5)})`),
        why: L('Pro: mitad de precio y es tuyo. Contra: se descompone más seguido.', 'Pro: half the price and you own it. Con: it breaks down more often.'), act: { kind: 'act', name: 'buyEq', args: { s: F.bn, mode: 'used' } } });
      O.push({ style: 'growth', title: L(`Rentar equipo para ${sName(F.bn)} (${money(base * 0.026)}/mes)`, `Lease equipment for ${sName(F.bn)} (${money(base * 0.026)}/mo)`),
        why: L('Pro: casi no usas efectivo hoy. Contra: a 4 años pagas más que comprándolo.', 'Pro: almost no cash today. Con: over 4 years you pay more than buying it.'), act: { kind: 'act', name: 'buyEq', args: { s: F.bn, mode: 'lease' } } });
      O.push({ style: 'cost', title: L(`Comprar equipo nuevo para ${sName(F.bn)} (${money(base)})`, `Buy new equipment for ${sName(F.bn)} (${money(base)})`),
        why: L('Pro: confiable y dura años. Contra: es el que más efectivo usa hoy.', 'Pro: reliable and lasts for years. Con: it uses the most cash today.'), act: { kind: 'act', name: 'buyEq', args: { s: F.bn, mode: 'new' } } });
    } else {
      const donor = leastLoadedTech(st, F);
      if (donor) O.push({ fix: true, style: 'cost', title: L(`Mover a ${donor.name} de ${sName(donor.from)} a ${sName(F.bn)}`, `Move ${donor.name} from ${sName(donor.from)} to ${sName(F.bn)}`),
        why: L('Pro: no cuesta nada y el cuello produce más hoy. Contra: la estación de donde sale puede volverse el siguiente cuello.', 'Pro: it costs nothing and the bottleneck produces more today. Con: the station they leave may become the next bottleneck.'),
        act: { kind: 'act', name: 'assign', args: { id: donor.id, station: F.bn } } });
      if (!st.pol.ot) O.push({ fix: !donor, style: 'safe', title: L('Tiempo extra mientras contratas', 'Overtime while you hire'),
        why: L('Pro: horas extra de inmediato. Contra: 50% más caro por hora y cansa al equipo.', 'Pro: extra hours right away. Con: 50% more per hour and it wears out the team.'),
        act: { kind: 'act', name: 'policy', args: { k: 'ot', v: true } } });
      O.push({ fix: !donor && !!st.pol.ot, style: 'growth', title: L(`Contratar un técnico para ${sName(F.bn)}`, `Hire a technician for ${sName(F.bn)}`),
        why: L('Pro: capacidad permanente en el cuello. Contra: costo fijo; revisa la asesoría de contratación abajo.', 'Pro: permanent capacity at the bottleneck. Con: a fixed cost; see the hiring advice below.'),
        act: { kind: 'tab', tab: 'people' } });
      if (st.pol.shifts < 2) O.push({ style: 'people', title: L('Abrir segundo turno', 'Open a second shift'),
        why: L('Pro: duplicas las horas del equipo sin comprar más. Contra: necesitas gente para ese turno y supervisión.', 'Pro: you double equipment hours without buying more. Con: you need people for that shift and supervision.'),
        act: { kind: 'act', name: 'policy', args: { k: 'shifts', v: 2 } } });
      O.push({ style: 'cost', title: L('Automatizar el cuello de botella', 'Automate the bottleneck'),
        why: L('Pro: menos horas por rack en la estación que manda. Contra: cuesta efectivo y tarda en dar resultado.', 'Pro: fewer hours per rack at the station that sets the pace. Con: it costs cash and takes time to pay back.'),
        act: { kind: 'tab', tab: 'improve' } });
      O.push({ style: 'safe', title: L('Subir el entrenamiento', 'Raise training'),
        why: L('Pro: la misma gente rinde más. Contra: cuesta horas mientras entrenan.', 'Pro: the same people produce more. Con: it costs hours while they train.'),
        act: { kind: 'act', name: 'policy', args: { k: 'train', v: 2 } } });
    }
  } else {
    O.push({ style: 'safe', title: L('Mantener el estándar y medir cada semana', 'Keep the standard and measure every week'),
      why: L('Pro: lo que funciona no se toca. Contra: no mejoras el costo.', 'Pro: what works stays. Con: you do not improve cost.'), act: null });
    O.push({ style: 'cost', title: L('Invertir en automatización en el cuello', 'Invest in automation at the bottleneck'),
      why: L('Pro: menos horas por rack y más capacidad. Contra: cuesta efectivo y necesitas ingeniería para sacarle provecho.', 'Pro: fewer hours per rack and more capacity. Con: it costs cash and you need engineering to get the benefit.'),
      act: { kind: 'tab', tab: 'improve' } });
    O.push({ style: 'people', title: L('Entrenar al equipo para que cubra varias estaciones', 'Cross-train the team to cover several stations'),
      why: L('Pro: cuando el cuello se mueve, la gente se mueve con él. Contra: horas de entrenamiento que no producen hoy.', 'Pro: when the bottleneck moves, people move with it. Con: training hours that do not produce today.'),
      act: { kind: 'act', name: 'policy', args: { k: 'train', v: 1 } } });
  }
  return finish(st, { id: 'plant', who: speaker(st, fpySev === 'ok' || fpySev === 'info' ? 'coo' : 'qa'), title: L('Planta', 'Plant'), sev, concept, now, trend, options: O,
    metrics: [{ k: 'fpy', v: pct(F.fpy), sev: fpySev }, { k: 'bn', v: F.bn ? sName(F.bn) + (missingEq ? '' : ' · ' + pct(bnU)) : '—', sev: bnSev }],
    say: L(`Planta: ${F.fpy == null ? 'sin datos de calidad aún' : pct(F.fpy) + ' a la primera'}${F.bn ? ', el cuello es ' + sName(F.bn) : ''}.`, `Plant: ${F.fpy == null ? 'no quality data yet' : pct(F.fpy) + ' first pass'}${F.bn ? ', the bottleneck is ' + sName(F.bn) : ''}.`) });
}
function leastLoadedTech(st, F) {
  let best = null;
  for (const s of E.STAGES) {
    if (s === F.bn) continue;
    const T = st.emps.filter(e => e.role === 'tech' && e.station === s); if (T.length < 2) continue;
    const cp = E.stationCap(st, s, true).std, load = F.LA[s] || 0;
    const spare = cp - load / 6;
    if (spare > 20 && (!best || spare > best.spare)) best = { spare, id: T[0].id, name: T[0].name, from: s };
  }
  return best;
}

/* ---------- topic: hiring ---------- */
function topicHire(st, F, X) {
  const { L, money, pct, sName, roleName, profName, lvName } = X;
  const concept = L('Contratar es un costo fijo: lo pagas cada semana haya trabajo o no. Contrata para el cuello de botella, no donde sobra gente. El nivel define rapidez y defectos: un Aprendiz cuesta menos pero hace 60% de lo que hace un Técnico II y comete el doble de errores. El estilo define cómo trabaja: "sigue procesos" comete menos errores, "experimentado" rinde más pero cuesta más, "mejorador" baja costos, "líder" cuida la moral e "innovador" propone ideas pero se equivoca más.',
    'Hiring is a fixed cost: you pay it every week whether there is work or not. Hire for the bottleneck, not where you already have spare people. Level sets speed and defects: a Trainee costs less but does 60% of what a Tech II does and makes twice the errors. Style sets how they work: follows process makes fewer errors, experienced produces more but costs more, improver cuts cost, leader protects morale and innovator brings ideas but makes more mistakes.');
  const runway = F.runway;
  // where is the work that nobody can do
  let worst = null;
  for (const s of E.STAGES) {
    const la = F.LA[s] || 0; if (la <= 0 && E.eqCount(st, s) === 0) continue;
    const sc = E.stationCap(st, s, true);
    const need = la / 6, def = need - sc.std;
    const eqFree = sc.eqH - sc.lab;
    if (def > 8 && (!worst || def > worst.def)) worst = { s, def, eqFree, sc };
  }
  const prof = F.fpy != null && F.fpy < 0.88 ? 'proc' : F.gm != null && F.gm < F.gmTarget * 0.6 ? 'mej' : F.morale < 60 ? 'lid' : (F.blW > 8 ? 'exp' : 'proc');
  const lv = runway < 6 ? 1 : F.fpy != null && F.fpy < 0.88 ? 2 : styleOf(st) === 'exp' ? 2 : 1;
  const techStd = (L_, p) => 40 * E.LV_EFF[L_] * E.PROF[p].eff;
  const techMonth = (L_, p) => E.marketWage(st, L_, p) * 40 * 4.33;
  const O = []; let sev = 'ok', now, trend;
  if (worst && worst.eqFree < 20 && E.eqCount(st, worst.s) > 0) {
    sev = 'warn';
    now = L(`En ${sName(worst.s)} faltan unas ${Math.round(worst.def)} horas por semana, pero el equipo ya está lleno de gente. Contratar ahí no sirve: primero necesitas otra estación o un segundo turno.`,
      `${sName(worst.s)} is short about ${Math.round(worst.def)} hours per week, but the equipment is already fully staffed. Hiring there does not help: first you need another station or a second shift.`);
    trend = L('Cuando agregues equipo o turno, ahí sí contrata.', 'Once you add equipment or a shift, then hire.');
    O.push({ fix: true, style: 'people', title: L('Abrir segundo turno y contratar para ese turno', 'Open a second shift and hire for it'),
      why: L('Pro: el mismo equipo trabaja el doble. Contra: necesitas gente nueva y supervisión de noche.', 'Pro: the same equipment works twice as much. Con: you need new people and night supervision.'),
      act: { kind: 'act', name: 'policy', args: { k: 'shifts', v: Math.min(3, st.pol.shifts + 1) } } });
    O.push({ style: 'safe', title: L(`Comprar equipo usado para ${sName(worst.s)}`, `Buy used equipment for ${sName(worst.s)}`),
      why: L(`Pro: ${money(E.EQ[worst.s].cost * 0.5)} y tienes lugar para más gente. Contra: más descomposturas.`, `Pro: ${money(E.EQ[worst.s].cost * 0.5)} and room for more people. Con: more breakdowns.`),
      act: { kind: 'act', name: 'buyEq', args: { s: worst.s, mode: 'used' } } });
    O.push({ style: 'cost', title: L('No contratar y prometer plazos más largos', 'Do not hire and promise longer lead times'),
      why: L('Pro: cero costo fijo nuevo. Contra: pierdes ventas.', 'Pro: no new fixed cost. Con: you lose sales.'), act: { kind: 'tab', tab: 'sales' } });
  } else if (worst) {
    const n = Math.max(1, Math.ceil(worst.def / techStd(lv, prof)));
    sev = runway < 4 ? 'bad' : 'warn';
    now = L(`A ${sName(worst.s)} le faltan unas ${Math.round(worst.def)} horas por semana para sacar tus pedidos en 6 semanas. Eso es ${n} × ${lvName(lv)} con estilo "${profName(prof)}". Cada uno cuesta unos ${money(techMonth(lv, prof))} al mes.`,
      `${sName(worst.s)} is short about ${Math.round(worst.def)} hours per week to build your orders in 6 weeks. That is ${n} × ${lvName(lv)} with the "${profName(prof)}" style. Each costs about ${money(techMonth(lv, prof))} per month.`);
    const whyProf = prof === 'proc' ? L('Elijo "sigue procesos" porque tu calidad es lo que más te cuesta ahora.', 'I pick follows process because quality is what costs you most right now.')
      : prof === 'mej' ? L('Elijo "mejorador" porque tu margen está bajo.', 'I pick improver because your margin is low.')
      : prof === 'lid' ? L('Elijo "líder" porque la moral está baja y se te puede ir gente.', 'I pick leader because morale is low and people may leave.')
      : L('Elijo "experimentado" porque tienes mucho trabajo y necesitas que rinda desde el primer día.', 'I pick experienced because you have a lot of work and need output from day one.');
    trend = (runway < 4 ? L('Pero ojo: con menos de 4 semanas de efectivo, un costo fijo nuevo es peligroso. Primero resuelve el dinero. ', 'But careful: with less than 4 weeks of cash, a new fixed cost is dangerous. Fix the money first. ') : '') + whyProf
      + L(` ${lvName(lv)} porque ${lv === 1 ? 'cuida tu efectivo y aprende rápido con tu entrenamiento' : 'necesitas buena calidad desde el inicio'}.`, ` ${lvName(lv)} because ${lv === 1 ? 'it protects your cash and learns quickly with your training' : 'you need good quality from the start'}.`);
    O.push({ fix: runway >= 4, style: 'growth', title: L(`Buscar ${n} × ${lvName(lv)} "${profName(prof)}" para ${sName(worst.s)}`, `Search for ${n} × ${lvName(lv)} "${profName(prof)}" for ${sName(worst.s)}`),
      why: L(`Pro: cubres el cuello con ${Math.round(techStd(lv, prof) * n)} horas por semana. Contra: ${money(techMonth(lv, prof) * n)} al mes fijos y llegan en 1 a 3 semanas.`, `Pro: you cover the bottleneck with ${Math.round(techStd(lv, prof) * n)} hours per week. Con: ${money(techMonth(lv, prof) * n)} per month fixed and they arrive in 1 to 3 weeks.`),

    else O.push({ fix: runway < 4, style: 'cost', title: L(`${lvName(0)} (más barato)`, `${lvName(0)} (cheaper)`),
      why: L(`Pro: ${money(techMonth(0, 'proc'))} al mes. Contra: rinde 60% y comete el doble de errores; necesita entrenamiento.`, `Pro: ${money(techMonth(0, 'proc'))} per month. Con: 60% output and twice the errors; needs training.`),
      act: { kind: 'act', name: 'hireSearch', args: { role: 'tech', prof: 'proc', level: 0 }, then: 'people' } });
    O.push({ style: 'safe', title: L(`${lvName(3)} "${profName('exp')}" por agencia`, `${lvName(3)} "${profName('exp')}" through an agency`),
      why: L(`Pro: llega la próxima semana, rinde más y casi no comete errores. Contra: cuesta ${money(techMonth(3, 'exp'))} al mes y la agencia cobra ${money(E.marketWage(st, 3, 'exp') * 2080 * 0.18)}.`, `Pro: arrives next week, produces more and makes almost no errors. Con: costs ${money(techMonth(3, 'exp'))} per month and the agency charges ${money(E.marketWage(st, 3, 'exp') * 2080 * 0.18)}.`),
      act: { kind: 'act', name: 'hireSearch', args: { role: 'tech', prof: 'exp', level: 3, agency: true }, then: 'people' } });
  } else if (F.bn && F.bnU > 0.98 && E.eqCount(st, F.bn) >= 0) {
    // the bottleneck is real but it is not a people problem
    const base = E.EQ[F.bn].cost;
