      `Your bottleneck is ${sName(F.bn)}, but you are not short of people there: you are short of ${F.bn === 'bi' ? 'burn-in bays' : 'equipment'}. Hiring does not fix it; the new person would just wait.`);
    trend = L('Primero agrega equipo; cuando el equipo esté lleno de trabajo, ahí contrata.', 'Add equipment first; once the equipment is full of work, then hire.');
    O.push({ fix: true, style: 'safe', title: L(`Comprar ${sName(F.bn)} usado (${money(base * 0.5)})`, `Buy used ${sName(F.bn)} (${money(base * 0.5)})`),
      why: L('Pro: mitad de precio. Contra: se descompone más seguido.', 'Pro: half the price. Con: it breaks down more often.'), act: { kind: 'act', name: 'buyEq', args: { s: F.bn, mode: 'used' } } });
    O.push({ style: 'growth', title: L(`Rentar ${sName(F.bn)} (${money(base * 0.026)}/mes)`, `Lease ${sName(F.bn)} (${money(base * 0.026)}/mo)`),
      why: L('Pro: casi sin efectivo hoy. Contra: más caro a largo plazo.', 'Pro: almost no cash today. Con: more expensive in the long run.'), act: { kind: 'act', name: 'buyEq', args: { s: F.bn, mode: 'lease' } } });
    O.push({ style: 'cost', title: L('No contratar ni comprar: prometer plazos más largos', 'Do not hire or buy: promise longer lead times'),
      why: L('Pro: no gastas nada. Contra: pierdes pedidos y los actuales siguen tarde.', 'Pro: you spend nothing. Con: you lose orders and current ones stay late.'), act: { kind: 'tab', tab: 'sales' } });
  } else {
    // nobody short on the floor: look at staff roles
    const has = r => E.hasRole(st, r);
    const revY = E.revenueTTM(st), supers = st.emps.filter(e => e.role === 'super').length;
    let role = null, why = '';
    if (F.techs === 0 && F.backlogU > 0) { role = 'tech'; why = L('Tienes pedidos y solo estás tú en el piso.', 'You have orders and only you on the floor.'); }
    else if (F.fpy != null && F.fpy < 0.88 && !has('qa') && revY > 800000) { role = 'qa'; why = L('Tu calidad está baja y nadie es dueño de ella.', 'Your quality is low and nobody owns it.'); }
    else if (F.techs >= 6 && !supers) { role = 'super'; why = L(`Tienes ${F.techs} técnicos sin supervisor; la productividad y la moral sufren.`, `You have ${F.techs} technicians with no supervisor; productivity and morale suffer.`); }
    else if ((F.backlogU === 0 || F.blW < 3) && !has('sales') && st.stats.delivered >= 3) { role = 'sales'; why = L('La planta tiene capacidad libre y te faltan pedidos.', 'The plant has spare capacity and you need orders.'); }
    else if (revY > 3e6 && !has('cfo')) { role = 'cfo'; why = L('Con tu tamaño, un CFO negocia mejor con bancos y proveedores y te ahorra más de lo que cuesta.', 'At your size, a CFO negotiates better with banks and suppliers and saves more than he costs.'); }
    else if (revY > 4e6 && !has('coo')) { role = 'coo'; why = L('Ya no puedes estar en el piso y en la oficina a la vez; un director de operaciones sube la productividad.', 'You can no longer be on the floor and in the office at once; an operations director raises productivity.'); }
    if (role && role !== 'tech') {
      sev = 'info';
      const pA = role === 'qa' ? 'proc' : role === 'sales' ? 'inn' : 'exp';
      const cost = r => E.marketSalary(st, role, r) / 12;
      now = why + L(` Te sugiero un ${roleName(role)} "${profName(pA)}", unos ${money(cost(pA))} al mes.`, ` I suggest a ${roleName(role)} "${profName(pA)}", about ${money(cost(pA))} per month.`);
      trend = runway < 8 ? L('Tu efectivo está justo: si contratas, que sea alguien que genere o ahorre más de lo que cuesta en menos de 6 meses.', 'Your cash is tight: if you hire, it has to be someone who earns or saves more than they cost within 6 months.')
        : L('Tienes efectivo para hacerlo; la pregunta es si esa persona te regresa más de lo que cuesta.', 'You have the cash for it; the question is whether that person returns more than they cost.');
      O.push({ fix: true, style: 'growth', title: L(`Buscar ${roleName(role)} "${profName(pA)}"`, `Search for a "${profName(pA)}" ${roleName(role)}`),
        why: L(`Pro: ${why.charAt(0).toLowerCase() + why.slice(1)} Contra: ${money(cost(pA))} al mes fijos.`, `Pro: it fixes this. Con: ${money(cost(pA))} per month fixed.`), act: { kind: 'act', name: 'hireSearch', args: { role, prof: pA }, then: 'people' } });
      O.push({ style: 'cost', title: L(`${roleName(role)} "${profName('proc')}" (más barato)`, `"${profName('proc')}" ${roleName(role)} (cheaper)`),
        why: L(`Pro: ${money(cost('proc'))} al mes. Contra: sigue el manual pero aporta menos ideas.`, `Pro: ${money(cost('proc'))} per month. Con: follows the book but brings fewer ideas.`), act: { kind: 'act', name: 'hireSearch', args: { role, prof: 'proc' }, then: 'people' } });
      O.push({ style: 'safe', title: L('Esperar un mes más', 'Wait one more month'),
        why: L('Pro: cuidas el efectivo. Contra: el problema sigue costando mientras tanto.', 'Pro: you protect cash. Con: the problem keeps costing you meanwhile.'), act: null });
    } else if (role === 'tech') {
      sev = 'warn';
      now = why + L(` Contrata tu primer técnico: ${lvName(1)} "${profName('proc')}" (${money(techMonth(1, 'proc'))} al mes) para integración.`, ` Hire your first technician: ${lvName(1)} "${profName('proc')}" (${money(techMonth(1, 'proc'))} per month) for integration.`);
      trend = L('Tú solo no vas a poder con los pedidos y con la oficina.', 'You alone cannot handle the orders and the office.');
      O.push({ fix: true, style: 'safe', title: L(`${lvName(1)} "${profName('proc')}"`, `${lvName(1)} "${profName('proc')}"`), why: L('Pro: barato y comete pocos errores. Contra: tarda en tomar velocidad.', 'Pro: cheap and makes few errors. Con: takes time to get up to speed.'), act: { kind: 'act', name: 'hireSearch', args: { role: 'tech', prof: 'proc', level: 1 }, then: 'people' } });
      O.push({ style: 'growth', title: L(`${lvName(2)} "${profName('exp')}"`, `${lvName(2)} "${profName('exp')}"`), why: L(`Pro: rinde desde el día uno. Contra: ${money(techMonth(2, 'exp'))} al mes.`, `Pro: productive from day one. Con: ${money(techMonth(2, 'exp'))} per month.`), act: { kind: 'act', name: 'hireSearch', args: { role: 'tech', prof: 'exp', level: 2 }, then: 'people' } });
      O.push({ style: 'cost', title: L('Trabajar tú en el piso un tiempo más', 'Keep working on the floor yourself for now'), why: L('Pro: cero costo. Contra: nadie atiende ventas, compras ni finanzas.', 'Pro: no cost. Con: nobody handles sales, purchasing or finance.'), act: { kind: 'tab', tab: 'people' } });
    } else {
      sev = 'ok';
      now = L('No contrates por ahora: ninguna estación está corta de gente para tus pedidos y cada contratación es costo fijo.', 'Do not hire for now: no station is short of people for your orders and every hire is a fixed cost.');
      trend = L('Te aviso en cuanto el cuello de botella necesite gente.', 'I will tell you as soon as the bottleneck needs people.');
      O.push({ style: 'safe', title: L('No contratar y vigilar el cuello', 'Do not hire and watch the bottleneck'), why: L('Pro: cuidas efectivo y margen. Contra: si llega un pedido grande, contratar tarda 1 a 3 semanas.', 'Pro: you protect cash and margin. Con: if a big order arrives, hiring takes 1 to 3 weeks.'), act: null });
      O.push({ style: 'people', title: L('Entrenar al equipo actual', 'Train the current team'), why: L('Pro: más rapidez y calidad con la misma gente. Contra: cuesta horas y dinero.', 'Pro: more speed and quality with the same people. Con: it costs hours and money.'), act: { kind: 'act', name: 'policy', args: { k: 'train', v: 1 } } });
      O.push({ style: 'growth', title: L('Contratar un vendedor para llenar la planta', 'Hire a salesperson to fill the plant'), why: L('Pro: más pedidos para la capacidad que ya pagas. Contra: tarda meses en traer clientes.', 'Pro: more orders for capacity you already pay for. Con: it takes months to bring in customers.'), act: { kind: 'act', name: 'hireSearch', args: { role: 'sales', prof: 'inn' }, then: 'people' } });
    }
  }
  return finish(st, { id: 'hire', who: speaker(st, 'hr'), title: L('A quién contratar', 'Who to hire'), sev, concept, now, trend, options: O, metrics: [],
    say: L('Contratación: ', 'Hiring: ') + now.split('. ')[0] + '.' });
}

/* ---------- grading the month ---------- */
function gradeMonth(st, mi, X) {
  const { L, t, optLabel, money } = X;
  const D = (st.decided || []).filter(d => E.cal(d.w).mi === mi);
  const out = [];
  for (const d of D) {
    const label = t('d_' + d.type);
    let g = 'ok', why = '', alt = '';
    const recTxt = d.rec ? t(d.rec.k, d.rec.p) : '';
    const recOpt = d.rec && typeof d.rec.opt === 'string' ? optLabel(d.type, d.rec.opt) : '';
    const followed = d.followed && d.followed.length > 0;
    if (d.type === 'quote' && d.q) {
      const o = st.opps.find(x => x.id === d.q.opp);
      const ord = st.orders.find(x => x.opp === d.q.opp);
      if (d.opt === 'decline') {
        const busy = d.ctx && (d.ctx.bnU > 0.95 || d.ctx.cw < 4);
        g = busy ? 'good' : 'ok';
        why = busy ? L('Rechazaste cuando la planta o el efectivo no daban. Bien cuidado.', 'You declined when the plant or the cash could not take it. Well protected.')
          : L('Rechazaste teniendo capacidad y efectivo: era una venta que la planta podía hacer.', 'You declined while you had capacity and cash: it was a sale the plant could build.');
      } else if (!ord) {
        if (o && o.status === 'lost') { g = 'ok'; why = L('La perdiste. Normalmente es por precio alto o plazo largo contra la competencia.', 'You lost it. Usually it is a high price or a long lead time against the competition.'); }
        else { g = 'pending'; why = L('El cliente todavía no decide.', 'The customer has not decided yet.'); }
      } else {
        const unitCost = d.q.cost || 0, price = d.q.price || ord.price;
        const mg = price > 0 ? (price - unitCost) / price : 0;
        const short = d.q.lead && d.q.sug && d.q.lead < d.q.sug;
        const late = ord.status === 'done' ? (ord.doneW > ord.due) : st.w > ord.due;
        g = late || mg < 0.03 ? 'bad' : short || mg < 0.08 ? 'ok' : 'good';
        why = (mg < 0.03 ? L(`La ganaste pero casi sin margen (${Math.round(mg * 100)}%).`, `You won it but with almost no margin (${Math.round(mg * 100)}%).`) : L(`La ganaste con ${Math.round(mg * 100)}% de margen.`, `You won it with a ${Math.round(mg * 100)}% margin.`))
          + (late ? L(' Va tarde: prometiste menos semanas de las que la planta podía.', ' It is late: you promised fewer weeks than the plant could do.') : short ? L(` Prometiste ${d.q.lead} semanas cuando la planta necesitaba ${d.q.sug}; es un riesgo.`, ` You promised ${d.q.lead} weeks when the plant needed ${d.q.sug}; that is a risk.`) : '');
      }
      if (g !== 'good' && d.rec && d.rec.opt) alt = typeof d.rec.opt === 'string' ? recOpt : L(`cotizar ${money(d.rec.opt.price)} por rack a ${d.rec.opt.lead} semanas.`, `quote ${money(d.rec.opt.price)} per rack at ${d.rec.opt.lead} weeks.`);
    } else if (followed) {
      g = 'good'; why = L('Seguiste la recomendación del asesor.', 'You followed the advice.');
    } else if (d.rec) {
      g = 'ok'; why = L('No seguiste la recomendación del asesor. No siempre es malo, pero revisa qué pasó.', 'You did not follow the advice. That is not always bad, but check what happened.');
      alt = (recOpt ? recOpt + ': ' : '') + recTxt;
    } else { g = 'ok'; why = L('No había una recomendación clara.', 'There was no clear recommendation.'); }
    out.push({ label, opt: d.opt === 'custom' ? '' : optLabel(d.type, d.opt), g, why, alt, lost: d.type === 'quote' && d.opt === 'quote' && /perdiste|lost it/i.test(why) });
  }
  // many lost quotes say the same thing: show them as one line
  const lost = out.filter(x => x.lost);
  if (lost.length > 1) {
    const keep = out.filter(x => !x.lost);
    keep.push({ label: lost[0].label, opt: '', g: lost.length >= 3 ? 'bad' : 'ok', why: L(`Perdiste ${lost.length} cotizaciones este mes. Normalmente es por precio alto o plazo largo; si pierdes muchas, compara tu precio con lo que sugería el asesor.`, `You lost ${lost.length} quotes this month. Usually it is a high price or a long lead time; if you lose many, compare your price with what the advisor suggested.`), alt: lost.map(x => x.alt).filter(Boolean).slice(0, 2).join(' · ') });
    return keep;
  }
  return out;
}

/* ---------- public API ---------- */
function reading(st, X, mode) {
  if (!st.kpi) return { topics: [], grades: [], speech: '' };
  const F = facts(st);
  const topics = [topicCash(st, F, X), topicProfit(st, F, X), topicCust(st, F, X), topicPlant(st, F, X), topicHire(st, F, X)];
  const grades = mode === 'month' && st.months.length ? gradeMonth(st, st.months[st.months.length - 1].mi, X) : [];
  const { L } = X;
  const sp = topics.map(T => {
    const r = T.options.find(o => o.rec);
    return `${T.title}. ${T.now} ${T.trend} ${r ? L('Te recomiendo: ', 'I recommend: ') + r.title + '.' : ''}`;
  });
  return { topics, grades, F, speech: sp.join(' ') };
}

function plWalk(st, mi, X) {

/* ---------- cloud save (Netlify Function + Blobs); off when /api/save is not there ---------- */
const Cloud = {
  avail: false, code: null, base: 0, status: '', timer: 0, busy: false, again: false,
  url(c, extra) { return '/api/save?code=' + encodeURIComponent(c) + (extra || ''); },
  norm(c) { c = String(c || '').toUpperCase().replace(/\s+/g, ''); if (/^[A-Z0-9]{5}$/.test(c)) c = 'RACK-' + c; return /^RACK-[A-Z0-9]{5}$/.test(c) ? c : null; },
  newCode() { const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let r = ''; const b = new Uint8Array(5); crypto.getRandomValues(b); b.forEach(x => r += A[x % A.length]); return 'RACK-' + r; },
  async init() {
    try { this.code = localStorage.getItem('rackforge_code'); this.base = +localStorage.getItem('rackforge_base') || 0; } catch (e) { this.code = null; }
    if (!/^https?:$/.test(location.protocol)) return false;
    // the function can take a few seconds to wake up, so try a few times
    for (let i = 0; i < 4 && !this.avail; i++) {
      try { const r = await fetch('/api/save?ping=1', { cache: 'no-store' }); const j = r.ok ? await r.json() : null; this.avail = !!(j && j.ok); } catch (e) { this.avail = false; }
      if (!this.avail && i < 3) await new Promise(f => setTimeout(f, 1500 * (i + 1)));
    }
    this.checked = true;
    return this.avail;
  },
  setCode(c, base) { this.code = c; this.setBase(base || 0); try { if (c) localStorage.setItem('rackforge_code', c); else localStorage.removeItem('rackforge_code'); } catch (e) { /* ignore */ } },
  setBase(b) { this.base = b; try { localStorage.setItem('rackforge_base', String(b)); } catch (e) { /* ignore */ } },
  payload() { return JSON.stringify({ st, lang, voice: Voice.on, savedAt, base: this.base }); },
  queue() { if (!this.avail || !this.code || !st) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 1500); },
  async push(force) {
    if (!this.avail || !this.code || !st) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; this.mark('sync');
    try {
      const r = await fetch(this.url(this.code, force ? '&force=1' : ''), { method: 'PUT', headers: { 'content-type': 'application/json' }, body: this.payload(), keepalive: this.payload().length < 60000 });
      if (r.status === 409) { await this.pull(); }
      else if (r.ok) { const j = await r.json(); this.setBase(j.rev); this.mark('ok'); } else this.mark('err');
    } catch (e) { this.mark('err'); }

  async get(c) { const r = await fetch(this.url(c), { cache: 'no-store' }); if (r.status === 404) return null; if (!r.ok) throw new Error('http ' + r.status); return r.json(); },
  // load the cloud copy when it is newer than what this device has
  async pull() {
    if (!this.avail || !this.code) return false;
    try {
      const d = await this.get(this.code); this.mark('ok');
      if (d && d.st && d.st.v === 1 && (d.rev || 0) > this.base) { this.setBase(d.rev || 0); apply(d); toast(t('cloudNewer')); return true; }

};
function apply(d) {

}

function chart(o) {
  const W = 520, H = o.h || 230, L = 62, Rp = 12, T = 12, Bt = 28;
  const all = o.series.flatMap(s => s.v.filter(x => x != null && isFinite(x)));
  if (!all.length) return `<div class="muted small">${t('noData')}</div>`;
  let mn = Math.min(0, ...all), mx = Math.max(...all); if (mx === mn) mx = mn + 1;
  const pad = (mx - mn) * 0.08; mx += pad; if (mn < 0) mn -= pad;
  const n = o.labels.length, xw = (W - L - Rp) / Math.max(1, n);
  const y = v => T + (H - T - Bt) * (1 - (v - mn) / (mx - mn)), x = i => L + xw * (i + 0.5);
  const fmt = o.fmt || money;
  let g = '';
  const ticks = o.series.some(s => s.int) ? Math.max(1, Math.min(4, Math.ceil(mx))) : 4;
  if (o.series.some(s => s.int)) { mx = ticks; mn = 0; }
  for (let i = 0; i <= ticks; i++) { const v = mn + (mx - mn) * i / ticks; g += `<line class="gl" x1="${L}" x2="${W - Rp}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`; }
  if (mn < 0) g += `<line x1="${L}" x2="${W - Rp}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
  const step = Math.ceil(n / 8);
  o.labels.forEach((lb, i) => { if (i % step === 0) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${lb}</text>`; });
  const bars = o.series.filter(s => s.bar), lines = o.series.filter(s => !s.bar);
  const bw = Math.max(1.5, xw * 0.8 / Math.max(1, bars.length));

const STC = { rcv: '#7f9150', int: '#4b79ab', cab: '#7a5cb0', leak: '#14807f', bi: '#b4661d', pack: '#9c855c' };
function shade(hex, f) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; r = Math.round(Math.min(255, r * f)); g = Math.round(Math.min(255, g * f)); b = Math.round(Math.min(255, b * f)); return `rgb(${r},${g},${b})`; }
const MapView = {
  cv: null, ctx: null, raf: 0, hits: [], pulseT: 0, colors: {}, colT: 0, lastDraw: 0, adv: null,
  advise(who, name, text) { if (this.adv && this.adv.text === text) return; this.adv = { who, name, text, t0: performance.now() }; },
  attach(cv) { this.cv = cv; this.ctx = cv.getContext('2d'); cv.onclick = e => this.click(e); this.start(); },
  stop() { cancelAnimationFrame(this.raf); this.raf = 0; },
  start() { this.stop(); const f = now => { if (!this.cv || !document.body.contains(this.cv)) { this.raf = 0; return; } if (now - this.lastDraw > 33) { this.lastDraw = now; try { this.draw(now); } catch (e) { /* keep loop alive */ } } this.raf = requestAnimationFrame(f); }; this.raf = requestAnimationFrame(f); },

  drawAdvisor(ctx, P, s, now, W, Dp) {

    const age = now - A.t0; if (age > 20000) return;
    const cs = getComputedStyle(document.documentElement), col = cs.getPropertyValue('--c-' + A.who).trim() || '#0ea5a4';
    // walks in through the receiving door and stops at the front of the plant
    const p = Math.min(1, age / 1800), e = p * p * (3 - 2 * p);
    const x0 = -1.5, y0 = Dp - 2.2, x1 = W * 0.42, y1 = Dp + 0.9;
    const px = x0 + (x1 - x0) * e, py = y0 + (y1 - y0) * e, step = p < 1 ? Math.sin(age / 90) : 0;
    const b = P(px, py, 0), sc = 1.7;
    ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.beginPath(); ctx.ellipse(b[0], b[1], s * 0.4, s * 0.18, 0, 0, Math.PI * 2); ctx.fill();
    const legL = P(px - 0.12, py + step * 0.12, 0), legR = P(px + 0.12, py - step * 0.12, 0), hip = P(px, py, 0.55 * sc);
    ctx.strokeStyle = '#1e293b'; ctx.lineWidth = Math.max(2, s * 0.12); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(hip[0], hip[1]); ctx.lineTo(legL[0], legL[1]); ctx.moveTo(hip[0], hip[1]); ctx.lineTo(legR[0], legR[1]); ctx.stroke();
    const top = P(px, py, 1.05 * sc), hd = P(px, py, 1.3 * sc);
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(hip[0] - s * 0.26, hip[1]); ctx.lineTo(top[0] - s * 0.24, top[1]); ctx.lineTo(top[0] + s * 0.24, top[1]); ctx.lineTo(hip[0] + s * 0.26, hip[1]); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(top[0], top[1] + 2); ctx.lineTo(top[0] - s * 0.06, (top[1] + hip[1]) / 2); ctx.lineTo(top[0] + s * 0.06, (top[1] + hip[1]) / 2); ctx.closePath(); ctx.fill();
    const pc = portraitCanvas(A.who, 128), hs = s * 1.05;
    ctx.save(); ctx.beginPath(); ctx.arc(hd[0], hd[1] - hs * 0.08, hs * 0.5, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill(); ctx.clip(); ctx.drawImage(pc, hd[0] - hs * 0.5, hd[1] - hs * 0.58, hs, hs); ctx.restore();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(1.5, s * 0.06); ctx.beginPath(); ctx.arc(hd[0], hd[1] - hs * 0.08, hs * 0.5, 0, Math.PI * 2); ctx.stroke();
    if (p < 1) return;
    // speech bubble
    const fs = Math.max(11, Math.round(s * 0.42)), pad = fs * 0.7, maxW = Math.min(this.cv.width * 0.46, fs * 26);
    ctx.font = `500 ${fs}px IBM Plex Sans, sans-serif`;
    const words = A.text.split(' '), lines = []; let cur = '';
    for (const w of words) { const tr = cur ? cur + ' ' + w : w; if (ctx.measureText(tr).width > maxW - pad * 2 && cur) { lines.push(cur); cur = w; } else cur = tr; }
    if (cur) lines.push(cur); const L = lines.slice(0, 5); if (lines.length > 5) L[4] += '…';
    const bw = Math.min(maxW, Math.max(...L.map(l => ctx.measureText(l).width)) + pad * 2), bh = (L.length + 1) * fs * 1.3 + pad * 1.4;
    let bx = hd[0] - bw * 0.35, by = hd[1] - s * 0.5 - bh;

    ctx.fillStyle = 'rgba(255,255,255,0.97)'; ctx.strokeStyle = col; ctx.lineWidth = Math.max(2, s * 0.08);

    ctx.beginPath(); ctx.moveTo(hd[0] - fs * 0.5, by + bh - 1); ctx.lineTo(hd[0], hd[1] - s * 0.28); ctx.lineTo(hd[0] + fs * 0.5, by + bh - 1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = col; ctx.font = `700 ${fs}px IBM Plex Sans, sans-serif`; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(A.name, bx + pad, by + pad * 0.7);
    ctx.fillStyle = '#10203f'; ctx.font = `500 ${fs}px IBM Plex Sans, sans-serif`;
    L.forEach((l, i) => ctx.fillText(l, bx + pad, by + pad * 0.7 + (i + 1) * fs * 1.3));

  },
  readColors() { const cs = getComputedStyle(document.documentElement); for (const k of ['floor', 'floor2', 'wallc', 'lot', 'rack', 'ink', 'muted', 'surface', 'accent', 'bad', 'good', 'teal', 'line']) this.colors[k] = cs.getPropertyValue('--' + k).trim(); },
  click(e) {
    const r = this.cv.getBoundingClientRect(), x = (e.clientX - r.left) * (this.cv.width / r.width), y = (e.clientY - r.top) * (this.cv.height / r.height);
    for (let i = this.hits.length - 1; i >= 0; i--) { const h = this.hits[i]; if (x >= h.x0 && x <= h.x1 && y >= h.y0 && y <= h.y1) { if (h.s) openStation(h.s); else if (h.go) { tab = h.go; renderAll(); } return; } }
  },
  draw(now) {
    const cv = this.cv, ctx = this.ctx, dpr = Math.min(2, window.devicePixelRatio || 1);

/* ---------- render all & boot ---------- */
function renderAll() {

function setupMeeting() {
